[project]
name = "aitest-platform-backend"
version = "0.1.0"
description = "FastAPI backend for the local-first AI test platform."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "httpx>=0.26",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "contract: backend API contract and acceptance tests",
]
